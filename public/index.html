<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141414" />
  <title data-i18n="title.home">MTG Treachery — Roles</title>
  <link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="brand-title">
        <img class="brand-logo" src="/assets/logo.png" alt="" width="56" height="56" />
        <h1>MTG Treachery</h1>
      </div>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="resume" class="card stack hidden">
      <div class="section-title center" data-i18n="home.resumeTitle">Rejoin your game</div>
      <div id="resume-list" class="stack"></div>
    </div>

    <!-- The name is shared by both actions below, so it sits on its own. -->
    <div class="card">
      <label for="name" data-i18n="name.label">Your name</label>
      <input id="name" type="text" data-i18n-placeholder="name.placeholder" placeholder="e.g. Ann" autocomplete="off" maxlength="12" enterkeyhint="done" />
    </div>

    <div class="card stack">
      <div>
        <label data-i18n="rarity.label">Card rarity</label>
        <div class="segmented" id="rarity">
          <button type="button" data-rarity="U" data-i18n="rarity.U" class="active">Uncommon</button>
          <button type="button" data-rarity="R" data-i18n="rarity.R">Rare</button>
          <button type="button" data-rarity="M" data-i18n="rarity.M">Mythic</button>
        </div>
      </div>
      <button id="create-btn" data-i18n="home.create">Create room</button>
    </div>

    <div class="divider" data-i18n="home.orJoin">— or join a room —</div>

    <div class="card stack">
      <div>
        <label for="code" data-i18n="code.label">Room code</label>
        <input id="code" type="text" class="code-input" placeholder="ABCD" autocomplete="off" maxlength="4" inputmode="text" enterkeyhint="go" />
      </div>
      <button id="join-btn" class="secondary" data-i18n="join">Join</button>
    </div>

    <div class="home-footer">
      <div class="lang-slot" id="lang-slot"></div>
      <div class="version-footer" id="app-version"></div>
    </div>
  </div>

  <script type="module" src="/version.js"></script>
  <script type="module" src="/rules.js"></script>
  <script type="module" src="/gallery.js"></script>
  <script type="module" src="/example.js"></script>
  <script type="module">
    import { createRoom, joinExisting, lockWhile, showError, getName, setName, findResumableRooms, withSlot } from '/app.js';
    import { t, onLocaleChange } from '/i18n.js';

    const nameEl = document.getElementById('name');
    const codeEl = document.getElementById('code');
    nameEl.value = getName();

    // Offer to rejoin any room this browser still has a valid session for.
    // The token (not the code) is what lets a player back into a game already
    // in progress, so this is the only reliable way back after an accidental exit.
    async function renderResumable() {
      const box = document.getElementById('resume');
      const list = document.getElementById('resume-list');
      const rooms = await findResumableRooms();
      list.innerHTML = '';
      if (!rooms.length) { box.classList.add('hidden'); return; }
      for (const room of rooms) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = t('home.resumeBtn', { code: room.code });
        btn.addEventListener('click', () => {
          location.replace(withSlot(`/room/${room.code}`));
        });
        list.append(btn);
      }
      box.classList.remove('hidden');
    }
    renderResumable();
    onLocaleChange(renderResumable); // relabel buttons when the language switches

    // Rarity segmented control (incremental: U / R+U / M+R+U). Default: Uncommon.
    let rarity = 'U';
    const rarityBox = document.getElementById('rarity');
    rarityBox.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-rarity]');
      if (!btn) return;
      rarity = btn.dataset.rarity;
      for (const b of rarityBox.children) b.classList.toggle('active', b === btn);
    });

    const createBtn = document.getElementById('create-btn');
    const joinBtn = document.getElementById('join-btn');
    const submitButtons = [createBtn, joinBtn];

    createBtn.addEventListener('click', () => {
      const name = nameEl.value.trim();
      if (!name) return showError(t('error.needName'));
      setName(name);
      lockWhile(submitButtons, createBtn, () => createRoom(name, rarity));
    });

    joinBtn.addEventListener('click', () => {
      const name = nameEl.value.trim();
      const code = codeEl.value.trim().toUpperCase();
      if (!name) return showError(t('error.needName'));
      if (code.length !== 4) return showError(t('error.codeLength'));
      setName(name);
      lockWhile(submitButtons, joinBtn, () => joinExisting(code, name));
    });

    // Enter in the name can't know whether you meant to create or join, so it
    // only submits when a full code is already typed; otherwise it just closes
    // the keyboard. Enter in the code always joins.
    nameEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (codeEl.value.trim().length === 4) joinBtn.click();
      else nameEl.blur();
    });
    codeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });
  </script>
</body>
</html>
