<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#141414" />
  <title>Lab — MTG Treachery</title>
  <link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    html, body {
      height: 100%;
    }
    body.lab {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 100dvh;
    }
    .lab-bar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .lab-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-right: 8px;
    }
    .lab-brand img {
      width: 28px;
      height: 28px;
      display: block;
    }
    .lab-brand span { color: var(--accent-hi); }
    .lab-device {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .lab-bar .segmented { width: auto; }
    .lab-bar .segmented button { padding: 8px 10px; font-size: 0.82rem; white-space: nowrap; }
    .lab-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }
    .lab-actions button {
      width: auto;
      padding: 10px 16px;
      font-size: 0.92rem;
    }
    .lab-status {
      width: 100%;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .lab-status.error-text { color: #f0a99f; }
    /* Phones keep a phone's size and wrap onto more rows instead of
       stretching. lab.js sets the device geometry and the fit (--device-*). */
    .phones {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 16px;
      padding: 16px;
    }
    .phone {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .phone-bar {
      width: var(--device-w);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .phone-bar .slot {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
    }
    .phone-bar .name { flex: 1; min-width: 2.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phone-bar button {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .phone-bar button:hover { color: var(--text); background: var(--panel); }
    .phone-bar .pop-out { flex-shrink: 0; padding: 4px 8px; font-size: 0.85rem; line-height: 1; }
    /* Each phone picks its own device (lab.js DEVICES). */
    .phone-bar .device-pick {
      min-width: 0;
      flex: 0 1 auto;
      height: 26px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .phone-bar .device-pick:hover { border-color: var(--accent); }

    /* ---- Device: drawn at real size, then scaled as a whole ----
       lab.js sets the geometry (--screen-w/-h, --status-h, --top-h, --bottom-h,
       --bezel, --radius) and the kind (data-kind="iphone" | "android"). */
    .device-slot {
      width: var(--device-w);
      height: var(--device-h);
    }
    .device {
      position: relative;
      width: calc(var(--screen-w) + 2 * var(--bezel)); /* real size, before scaling */
      padding: var(--bezel);
      border-radius: calc(var(--radius) + var(--bezel));
      background: #070707;
      /* frame rim + inner edge + drop shadow */
      box-shadow:
        inset 0 0 0 2px #56565a,
        inset 0 0 0 4px #161618,
        0 20px 50px rgba(0, 0, 0, 0.6);
      transform: scale(var(--device-scale, 1));
      transform-origin: 0 0;
    }
    .device[data-kind="android"] {
      background: #0b0b0c;
      box-shadow:
        inset 0 0 0 2px #3c3d40,
        0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .device .btn {
      position: absolute;
      width: 4px;
      border-radius: 2px;
      background: #46464a;
    }
    /* iPhone: action + volume on the left, side button on the right. */
    .device[data-kind="iphone"] .b1 { left: -3px; top: 170px; height: 34px; }
    .device[data-kind="iphone"] .b2 { left: -3px; top: 230px; height: 64px; }
    .device[data-kind="iphone"] .b3 { left: -3px; top: 306px; height: 64px; }
    .device[data-kind="iphone"] .b4 { right: -3px; top: 266px; height: 104px; }
    /* Pixel: power and volume rocker on the right. */
    .device[data-kind="android"] .b1 { display: none; }
    .device[data-kind="android"] .b2 { right: -3px; top: 180px; height: 56px; }
    .device[data-kind="android"] .b3 { right: -3px; top: 260px; height: 112px; }
    .device[data-kind="android"] .b4 { display: none; }
    .screen {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, "SF Pro Text", Roboto, sans-serif;
    }
    /* System status bar: the browser paints it with the page's theme color. */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--status-h);
      background: var(--bg);
    }
    .top-bar {
      position: absolute;
      top: var(--status-h);
      left: 0;
      right: 0;
      height: var(--top-h);
    }
    .viewport {
      position: absolute;
      top: calc(var(--status-h) + var(--top-h));
      left: 0;
      width: var(--screen-w);
      height: calc(var(--screen-h) - var(--status-h) - var(--top-h) - var(--bottom-h));
    }
    .viewport iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    .bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--bottom-h);
    }

    /* iPhone: clock and icons centered in the "ears" beside the Dynamic Island. */
    .status-bar .island {
      position: absolute;
      top: 11px;
      left: 50%;
      width: 126px;
      height: 37px;
      margin-left: -63px;
      border-radius: 19px;
      background: #000;
    }
    .status-bar .ear {
      position: absolute;
      top: 17px;
      width: calc((var(--screen-w) - 126px) / 2);
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .status-bar .ear.left { left: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
    .status-bar .ear.right { right: 0; }
    /* Safari's bottom bar (iOS 15+): address field, toolbar, home indicator. */
    .device[data-kind="iphone"] .bottom-bar {
      background: #1c1c1e;
      box-shadow: 0 -0.5px 0 rgba(255, 255, 255, 0.14);
    }
    .bottom-bar .address {
      height: 44px;
      margin: 8px 14px 0;
      padding: 0 14px;
      border-radius: 12px;
      background: #2c2c2e;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
    }
    .bottom-bar .aa { font-size: 15px; font-weight: 600; letter-spacing: -0.5px; }
    .bottom-bar .host,
    .top-bar .host { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bottom-bar .host { text-align: center; }
    .bottom-bar .toolbar {
      height: 44px;
      margin-top: 4px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      color: #0a84ff;
    }
    .bottom-bar .toolbar .off { color: #636366; }
    .bottom-bar svg, .top-bar svg { display: block; }
    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 140px;
      height: 5px;
      margin-left: -70px;
      border-radius: 3px;
      background: #fff;
    }

    /* Android: clock left, punch-hole camera, icons right. */
    .status-bar .clock {
      position: absolute;
      left: 22px;
      top: 0;
      height: var(--status-h);
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
    }
    .status-bar .camera {
      position: absolute;
      top: 6px;
      left: 50%;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: #000;
      box-shadow: 0 0 0 1.5px #1d1d20;
    }
    .status-bar .icons {
      position: absolute;
      right: 20px;
      top: 0;
      height: var(--status-h);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-bar .icons svg { height: 11px; width: auto; }
    /* Chrome's top bar: omnibox, tab count, menu. */
    .device[data-kind="android"] .top-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px 0 10px;
      background: #1f1f1f;
      color: #e3e3e3;
    }
    .top-bar .omnibox {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 14px;
      border-radius: 19px;
      background: #303134;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }
    .top-bar .tab-count {
      width: 19px;
      height: 19px;
      border: 2px solid currentColor;
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    /* Gesture navigation: a handle over the bottom of the page. */
    .gesture-bar {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 108px;
      height: 4px;
      margin-left: -54px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.75);
      pointer-events: none;
    }
  </style>
</head>
<body class="lab">
  <div class="lab-bar">
    <div class="lab-brand">
      <img src="/assets/logo.png" alt="" width="28" height="28" />
      MTG Treachery <span>lab</span>
    </div>

    <div class="lab-device" id="scale" title="Phones are drawn at real size, shrunk only to fit the window"></div>

    <div class="segmented" id="count" title="How many phones">
      <button type="button" data-n="4" class="active">4</button>
      <button type="button" data-n="5">5</button>
      <button type="button" data-n="6">6</button>
      <button type="button" data-n="7">7</button>
      <button type="button" data-n="8">8</button>
    </div>

    <div class="segmented" id="rarity" title="Card rarity">
      <button type="button" data-rarity="U" class="active">Uncommon</button>
      <button type="button" data-rarity="R">Rare</button>
      <button type="button" data-rarity="M">Mythic</button>
    </div>

    <div class="lab-actions">
      <button type="button" id="blank-btn" class="secondary">Blank phones</button>
      <button type="button" id="fill-btn">Start table</button>
      <button type="button" id="reset-btn" class="secondary">Reset</button>
    </div>

    <div class="lab-status" id="status">Each frame is a separate player. Start a table, or open blank phones and play through create / join yourself.</div>
  </div>

  <div class="phones" id="phones"></div>

  <script type="module" src="/lab.js"></script>
</body>
</html>
